<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>ESP-AT</title>
	<link rel="icon" href="data:image/ico;base64,aWNv">
	<style>
		* {
			margin: 0;
			padding: 0;
			outline: 0 !important
		}

		.d-flex {
			display: -moz-box;
			display: -ms-flexbox;
			display: -webkit-box;
			display: -webkit-flex;
			display: box;
			display: flex
		}

		.d-j-c {
			-webkit-justify-content: center;
			-moz-box-pack: center;
			-webkit-box-pack: center;
			box-pack: center;
			justify-content: center
		}

		.d-a-i {
			-webkit-align-items: center;
			box-align: center;
			-moz-box-align: center;
			-webkit-box-align: center;
			align-items: center
		}

		/* ==== TEMA VERDE CLARO ==== */
		.home-wrap {
			position: relative;
			height: 100vh;
			background: #8BE28B;
			/* fundo verde claro */
		}

		.home-left {
			height: 105%;
			background: #A7F0A7;
			/* painel esquerdo mais claro */
			width: 40%;
			margin-left: -10px;
			border-top-left-radius: 20px;
			border-bottom-left-radius: 20px;
			border-bottom-right-radius: 20%;
			border-top-right-radius: 20%;
			box-shadow: -6px 0 20px #A7F0A7;
		}

		.btn-wrap button {
			width: 80%;
			max-width: 300px;
			line-height: 40px;
			background: #4CAF50;
			/* botão verde */
			color: #fff;
			border: 0;
			border-radius: 6px;
			cursor: pointer;
			transition: all .2s linear
		}

		.btn-wrap button:hover {
			opacity: .85
		}

		.header-wrap {
			position: fixed;
			top: 0;
			left: 0;
			box-sizing: border-box;
			padding: 0 20px;
			width: 100%;
			height: 56px;
			border-bottom: 1px solid rgba(255, 255, 255, .2)
		}

		.header-wrap .header-logo {
			color: transparent;
			letter-spacing: 6px;
			font-weight: 700;
			font-style: oblique;
			font-size: 30px;
			-webkit-text-stroke: 1.6px #fff
		}

		.header-wrap ul {
			display: inline-block;
			margin-left: 90px;
			list-style: none;
			vertical-align: middle
		}

		.header-wrap ul li {
			display: inline-block
		}

		.header-wrap ul li a {
			margin: 0 10px;
			padding: 6px 20px;
			color: #fff;
			text-decoration: none !important;
			font-size: 16px
		}

		.header-wrap ul li a.active,
		.header-wrap ul li a:hover {
			border-radius: 20px;
			background: #fff;
			box-shadow: 0 0 6px #fff;
			color: #2E7D32;
			/* verde escuro */
		}

		.home-content {
			width: 80%;
			height: 80%;
			max-height: 700px;
			max-width: 1100px;
			background: #fff;
			border-radius: 20px;
			box-shadow: 2px 0 12px #fff;
			font-size: 14px
		}

		.home-left .content {
			padding-left: 6%;
			box-sizing: border-box;
			text-align: left;
			width: 100%;
			color: transparent;
			font-size: 50px;
			font-weight: 700;
			letter-spacing: 6px;
			font-style: oblique;
			-webkit-text-stroke: 1.6px #fff
		}

		.home-left .content h2 {
			font-size: 40px;
			margin-bottom: 20px
		}

		.home-left .content p {
			font-size: 30px
		}

		.home-left,
		.home-right {
			width: 50%
		}

		.home-right .content {
			width: 80%;
			text-align: center
		}

		.home-right .content h3 {
			color: #666;
			font-size: 30px;
			letter-spacing: 4px;
			font-style: oblique;
			-webkit-text-stroke: 1.6px #000
		}

		.device-wrap {
			width: 100%;
			margin: 50px 0
		}

		.device-item {
			position: relative;
			width: 100%;
			max-width: 300px;
			margin: 0 auto 20px
		}

		.ssid-input {
			width: 100%
		}

		.note-wrap {
			margin-top: 20px;
			text-align: left
		}

		.device-item input {
			width: 100%;
			border: 0;
			padding: 16px 4px 12px;
			border-bottom: 1px solid #d5d5d5;
			outline: 0 !important;
			font-size: 14px;
			background: 0 0;
			transition: all .2s linear;
			box-sizing: border-box
		}

		.device-item input:focus {
			border-color: #4CAF50
		}

		.msg {
			position: fixed;
			height: 100%;
			width: 100%;
			left: 0;
			top: 0;
			background: rgba(0, 0, 0, .1);
			z-index: 10
		}

		.msg.hide {
			display: none
		}

		.msg .content,
		.msg .content-time {
			position: absolute;
			top: 50%;
			left: 50%;
			padding: 8px 15px;
			background: rgba(0, 0, 0, .6);
			color: #fff;
			width: 80%;
			max-width: 240px;
			text-align: center;
			font-size: 14px;
			border-radius: 20px;
			transform: translate(-50%, -50%)
		}

		.spinner {
			margin: -10px -40px;
			width: 70px;
			text-align: center;
			position: absolute;
			left: 50%;
			top: 50%
		}

		.spinner>div {
			width: 16px;
			height: 16px;
			background-color: #fff;
			border-radius: 100%;
			display: inline-block;
			margin: 0 2px;
			-webkit-animation: sk-bouncedelay 1.4s infinite ease-in-out both;
			animation: sk-bouncedelay 1.4s infinite ease-in-out both
		}

		.spinner .bounce1 {
			-webkit-animation-delay: -.32s;
			animation-delay: -.32s
		}

		.spinner .bounce2 {
			-webkit-animation-delay: -.16s;
			animation-delay: -.16s
		}

		@-webkit-keyframes sk-bouncedelay {

			0%,
			100%,
			80% {
				-webkit-transform: scale(0)
			}

			40% {
				-webkit-transform: scale(1)
			}
		}

		@keyframes sk-bouncedelay {

			0%,
			100%,
			80% {
				transform: scale(0)
			}

			40% {
				transform: scale(1)
			}
		}

		.timeout-info {
			color: #FF5252
		}

		.icon {
			position: absolute;
			right: 0;
			top: 0;
			display: inline-block;
			width: 44px;
			height: 44px;
			cursor: pointer
		}

		.icon:after {
			content: "";
			position: absolute;
			top: 15px;
			left: 15px;
			width: 10px;
			height: 10px;
			border-bottom: 2px solid #999;
			border-right: 2px solid #999;
			transform: rotate(45deg)
		}

		#ssid {
			padding-right: 45px
		}

		.wifi-list-wrap {
			position: absolute;
			left: 0;
			top: 45px;
			background: #fff;
			padding: 6px 0;
			box-shadow: 0 0 6px #ccc;
			z-index: 1;
			border-radius: 6px;
			width: 100%;
			max-height: 300px;
			overflow: hidden;
			overflow-y: auto;
			text-align: left;
			box-sizing: border-box
		}

		.wifi-list-wrap ul {
			width: 100%;
			list-style: none
		}

		.wifi-list-wrap li {
			display: block;
			position: relative;
			line-height: 2.1;
			font-size: 14px;
			color: #666;
			padding: 4px 40px;
			box-sizing: border-box;
			cursor: pointer;
			width: 100%;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap
		}

		.wifi-list-wrap li:hover {
			background: rgba(76, 175, 80, .25)
		}

		.wifi-list-wrap .selected {
			position: absolute;
			top: 12px;
			left: 15px;
			display: none;
			width: 12px;
			height: 6px;
			border-left: 2px solid #4CAF50;
			border-bottom: 2px solid #4CAF50;
			transform: rotate(-45deg)
		}

		.wifi-list-wrap li.active .selected {
			display: inline-block
		}

		.lock-img {
			position: absolute;
			top: 9px;
			right: 15px;
			width: 20px;
			height: 20px
		}

		.lock-img svg {
			width: 18px;
			height: auto
		}

		.no-data {
			text-align: center
		}

		.hide {
			display: none
		}

		@media(max-width:768px) {
			.home-wrap {
				background: 0;
				background-image: linear-gradient(#8BE28B, rgba(139, 226, 139, .4));
				/* verde mobile */
			}

			.home-right .content h3 {
				color: transparent;
				font-size: 32px;
				letter-spacing: 4px;
				font-style: oblique;
				-webkit-text-stroke: 1.6px #fff
			}

			.home-left {
				display: none
			}

			.home-right {
				width: 100%
			}

			.home-content {
				height: auto;
				width: 100%;
				max-width: 100%;
				max-height: 100vh;
				padding: 30px 30px 56px;
				background: 0 0;
				box-shadow: none;
				box-sizing: border-box
			}

			.home-right .content {
				width: 100%
			}

			.device-item {
				max-width: 100%
			}

			.device-item input {
				width: 100%;
				background: 0 0;
				padding: 12px 4px 12px 20px;
				border: 1px solid rgba(255, 255, 255, .65);
				color: #fff;
				border-radius: 20px;
				box-sizing: border-box
			}

			.device-item input:focus,
			.device-item input:hover {
				border-color: #fff
			}

			.btn-wrap button {
				width: 100%;
				max-width: 100%
			}

			.icon {
				width: 42px;
				height: 42px
			}

			.icon:after {
				top: 12px;
				left: 12px;
				border-color: rgba(255, 255, 255, .6)
			}

			.wifi-list-wrap {
				position: fixed;
				top: 0;
				left: 0;
				bottom: 0;
				width: 100%;
				height: 100%;
				max-height: 100%;
				padding: 0;
				background: 0 0;
				border-radius: 0
			}

			.wifi-list-wrap .mask {
				height: 100%;
				width: 100%;
				background: rgba(0, 0, 0, .3)
			}

			.wifi-list-wrap .content {
				position: absolute;
				bottom: 0;
				width: 100%;
				overflow: hidden;
				background: #fff;
				border-top-left-radius: 6px;
				border-top-right-radius: 6px
			}

			.wifi-list-wrap .content h3 {
				font-size: 16px;
				margin: 0;
				padding: 10px 20px;
				box-sizing: border-box;
				text-align: center;
				border-bottom: 1px solid #eee
			}

			.wifi-list-wrap .content h3 span {
				font-size: 14px;
				font-weight: 400;
				color: #4CAF50;
				float: right;
				cursor: pointer
			}

			.wifi-list-wrap .content ul {
				height: 250px;
				overflow: hidden;
				overflow-y: auto
			}

			.wifi-list-wrap .content ul li {
				padding: 6px 40px;
				border-bottom: 1px solid #eee
			}

			.cancel-wrap {
				border-top: 1px solid #eee;
				padding: 10px 0;
				text-align: center;
				font-size: 14px;
				cursor: pointer
			}

			.header-wrap {
				top: unset;
				bottom: 0;
				border-top: 1px solid rgba(255, 255, 255, .2);
				background: rgba(76, 175, 80, .10);
				/* barra inferior esverdeada */
			}

			.header-wrap .header-logo {
				display: none
			}

			.header-wrap ul {
				margin-left: 0;
				width: 100%;
				font-size: 0
			}

			.header-wrap ul li {
				display: inline-block;
				width: 100%;
				text-align: center
			}

			.header-wrap ul li a {
				outline: 0 !important;
				color: #333;
				font-size: 14px
			}

			.header-wrap ul li a.active,
			.header-wrap ul li a:hover {
				background: 0;
				box-shadow: none
			}
		}
	</style>
</head>

<body id="body-wrap">
	<div class="home-wrap d-flex d-a-i d-j-c">
		<div class="header-wrap d-flex d-a-i">
			<span class="header-logo">DI-9002</span>
			<ul>
				<li><a id="esp-at-link" class="active" href="javascript:void(0)">Wi-Fi</a></li>
			</ul>
		</div>

		<div class="home-content d-flex d-a-i">
			<div class="home-left d-flex d-a-i">
				<div class="content">
					<h2>MEDPEJ</h2>
					<p id="welcome-wrap">DI-9002</p>
				</div>
			</div>

			<div id="esp-at-wrap" class="home-right d-flex d-a-i d-j-c">
				<div class="content">
					<h3>MEDPEJ</h3>
					<div class="device-wrap">
						<div id="ssid-wrap" class="device-item">
							<div class="ssid-input">
								<input id="ssid" maxlength="32" type="text" placeholder="Nome da rede (SSID)" />
								<span id="show-wifi-list" class="icon"></span>
							</div>
						</div>
						<div class="device-item">
							<input id="password" maxlength="64" type="password" placeholder="Senha" />
						</div>
						<div class="device-item">
							<input id="message" disabled type="text" readonly placeholder="Mensagem" />
						</div>
					</div>
					<div class="btn-wrap">
						<button id="start-connect" onclick="postData()" class="btn">Conectar</button>
					</div>

					<div class="note-wrap device-item">
						<span id="note-text" style="color: red">Atenção:</span>
						<span id="note-desc">
							Se a rede alvo for o hotspot do mesmo dispositivo que abriu esta página, o navegador pode
							não receber o resultado da conexão Wi-Fi.
						</span>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		var isSend = !1, isShowWifi = !1, wifiList = [], timeoutNum = 0;

		var Ajax = {
			get: function (e, t, i) {
				var n;
				window.XMLHttpRequest ? n = new XMLHttpRequest : window.ActiveObject && (n = new ActiveXobject("Microsoft.XMLHTTP"));
				n.open("GET", e, !0);
				i && n.setRequestHeader("Object", i);
				n.onreadystatechange = function () {
					4 == n.readyState && (200 == n.status || 304 == n.status ? t.call(this, n.responseText) : (showMessage(getPrompt("requestFailed"), 1e3), hideLoading("msg-load")));
				};
				n.send();
			},
			post: function (e, t, i, n, o = !0, s = !1) {
				var a;
				showLoading();
				window.XMLHttpRequest ? a = new XMLHttpRequest : window.ActiveObject && (a = new ActiveXobject("Microsoft.XMLHTTP"));
				a.open("POST", e, o);
				a.setRequestHeader("Content-Type", s ? "application/json" : "application/x-www-form-urlencoded;charset=UTF-8");
				n && a.setRequestHeader("Object", n);
				a.onreadystatechange = function () {
					4 == a.readyState && (200 == a.status || 304 == a.status ? i.call(this, a.responseText) : (hideLoading("msg-load"), showMessage(getPrompt("connectFailed"), 2e3)));
				};
				a.send(t);
			}
		};

		/* ==== SOMENTE PORTUGUÊS (sem chinês) ==== */
		const uiText = {
			enterSsid: "Informe o SSID.",
			ssidError: "O SSID é muito longo (máx. 32 bytes).",
			passwordError: "A senha é muito longa (máx. 64 bytes).",
			requestFailed: "Falha ao solicitar dados.",
			connectFailed: "Falha ao conectar. Tente novamente.",
			connectTimeout: "Tempo esgotado na conexão. Tente novamente.",
			closedWeb: 'Conectado! Esta página será fechada em <span id="timeout-info" class="timeout-info">5</span> segundos.',
			wifiList: "Lista de Wi-Fi",
			refresh: "Atualizar",
			getWifiFailed: "Falha ao obter a lista de redes Wi-Fi.",
			noData: "Nenhuma rede encontrada.",
			cancel: "Cancelar"
		};

		function getPrompt(key) { return uiText[key] || ""; }

		function getData() {
			Ajax.get("/getstainfo", function (e) {
				e = JSON.parse(e);
				try {
					document.getElementById("ssid").value = e.sta_ssid;
					document.getElementById("password").value = e.sta_password;
					document.getElementById("message").value = e.message;
				} catch (e) { }
			});
		}

		function getStatus() {
			if (timeoutNum > 40) return hideLoading("msg-load"), showMessage(getPrompt("connectTimeout"), 2e3), !1;
			timeoutNum++;
			Ajax.get("/getstainfo", function (e) {
				e = JSON.parse(e);
				document.getElementById("message").value = e.message;
				1 == e.state ? getResult() : 0 == e.state ? setTimeout(function () { getStatus(); }, 1e3)
					: (hideLoading("msg-load"), showMessage(getPrompt("connectFailed"), 2e3));
			});
		}

		function getResult() {
			Ajax.post("/getresult", "received=1", function () {
				isSend = !1;
				hideLoading("msg-load");
				showTimeout();
			});
		}

		function postData() {
			timeoutNum = 0;
			var e = document.getElementById("ssid").value,
				t = document.getElementById("password").value;

			if ("" == e || null == e) return showMessage(getPrompt("enterSsid"), 1200), !1;
			if (e.length > 32) return showMessage(getPrompt("ssidError"), 1600), !1;
			if (t.length > 64) return showMessage(getPrompt("passwordError"), 1600), !1;

			var i = { ssid_len: e.length || 0, ssid: e, password_len: t.length || 0, password: t };
			Ajax.post("/setstainfo", JSON.stringify(i), function (e) {
				e = JSON.parse(e);
				isSend = !0;
				0 == e.state ? setTimeout(function () { getStatus(); }, 1000)
					: (hideLoading("msg-load"), showMessage(getPrompt("connectFailed"), 2000));
			}, null, !0, !0);
		}

		function showMessage(e, t) {
			var i = document.getElementById("body-wrap"), n = document.createElement("div");
			n.innerHTML = '<div class="content">' + e + "</div>";
			n.setAttribute("class", "msg");
			i.appendChild(n);
			t && setTimeout(function () { i.removeChild(n); }, t);
		}

		function showTimeout() {
			hideLoading("msg-load");
			var e = document.getElementById("body-wrap"), t = document.createElement("div");
			t.innerHTML = '<div id="timeoutId" class="content-time">' + getPrompt("closedWeb") + "</div>";
			t.setAttribute("class", "msg");
			e.appendChild(t);

			var i = 5, n = setInterval(function () {
				i--;
				document.getElementById("timeout-info").innerText = i;
				i < 0 && (e.removeChild(t), closeWindow(), clearInterval(n));
			}, 1000);
		}

		function closeWindow() { window.open("about:blank", "_self").close(); }

		function showLoading() {
			var e = document.getElementById("body-wrap"), t = document.createElement("div");
			t.innerHTML = '<div class="load"><div class="spinner"><div class="bounce1"></div><div class="bounce2"></div><div class="bounce3"></div></div></div>';
			t.setAttribute("class", "msg");
			t.setAttribute("id", "msg-load");
			e.appendChild(t);
		}

		function hideLoading(id) {
			var t = document.getElementById(id);
			t && (t.setAttribute("class", "msg hide"), document.getElementById("body-wrap").removeChild(t));
		}

		window.onbeforeunload = function () {
			if (isSend) try {
				if (!navigator.sendBeacon) return;
				navigator.sendBeacon("http://192.168.4.1/getresult", "received=1");
			} catch (e) { }
		};

		var isMobile = (window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 768) <= 768;

		function getaprecord() {
			showLoading();
			Ajax.get("/getaprecord", function (e) {
				e = JSON.parse(e);
				try {
					0 == e.state ? (initWifiList(wifiList = e.aplist, null, "wifi-list-wrap", "ssid", "ssid-wrap"), hideLoading("msg-load"))
						: showMessage(getPrompt("getWifiFailed"), 2000);
				} catch (e) { showMessage(getPrompt("getWifiFailed"), 2000); }
			});
		}

		function initWifiList(e, t, i = "wifi-list-wrap", n = "ssid", o = "ssid-wrap") {
			removeWifiList(i, o);
			var s = document.createElement("div");
			s.setAttribute("id", i);
			s.setAttribute("class", "wifi-list-wrap");

			if (isMobile) {
				var a = document.createElement("div");
				a.setAttribute("class", "mask");
				a.setAttribute("id", "mask");
				a.onclick = function () { removeWifiList(i, o); };
				s.appendChild(a);
			}

			var d = document.createElement("ul"), r = "", c = document.getElementById(n).value;

			for (var l = 0; l < e.length; l++) {
				var m = e[l];
				if (!t || -1 != m.ssid.indexOf(t)) {
					var u = (c == m.ssid) ? "active" : "";
					r += `<li data-value="${encodeURIComponent(m.ssid)}" onclick="selectCurWifi(event, '${n}', '${i}', '${o}')" class="d-flex d-a-i ${u}"><span class="selected"></span>${m.ssid}`;
